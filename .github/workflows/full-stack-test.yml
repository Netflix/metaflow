name: Test Metaflow with complete Kubernetes stack

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# On PRs, cancel old runs when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Metaflow
        run: |
          python -m pip install --upgrade pip
          pip install . kubernetes

      # Start minikube on its own (all-up reuses a running cluster) so cached
      # images can be loaded before Tilt deploys anything.
      - name: Start minikube
        run: |
          MINIKUBE_CPUS=2 metaflow-dev setup-minikube
          devtools_dir=$(python -c "from metaflow.cmd.make_wrapper import find_makefile; print(find_makefile().parent)")
          echo "${devtools_dir}/.devtools/minikube" >> "$GITHUB_PATH"

      - name: Restore minikube image cache
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/minikube-image-cache
          key: minikube-images-full-stack-${{ hashFiles('devtools/Tiltfile') }}
          restore-keys: minikube-images-full-stack-

      - name: Pre-load cached images into minikube
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: devtools/ci/load-minikube-images.sh

      - name: Bring up the environment
        run: |
          echo "Starting environment in the background..."
          MINIKUBE_CPUS=2 metaflow-dev all-up &
          WAIT_TIMEOUT=900 metaflow-dev wait-until-ready

      - name: Save minikube images to cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: devtools/ci/save-minikube-images.sh

      - name: Store minikube image cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/minikube-image-cache
          key: minikube-images-full-stack-${{ hashFiles('devtools/Tiltfile') }}

      - name: Wait & run flow
        run: |
          cat <<EOF | metaflow-dev shell
          echo "Environment is ready; running flow now..."
          python metaflow/tutorials/00-helloworld/helloworld.py --environment=pypi run --with kubernetes --with card
          EOF

      - name: Dump tilt state on failure
        if: failure()
        run: |
          echo "=== Tilt resource status ==="
          tilt get uiresources -o wide 2>/dev/null || true
          echo "=== Recent tilt logs (last 50 lines) ==="
          tail -50 /tmp/tilt.log 2>/dev/null || true

      - name: Tear down environment
        if: always()
        run: |
          metaflow-dev down
